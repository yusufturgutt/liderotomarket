# Fly.io ayarları — Lider Otomarket
# Maliyet: en küçük makine (shared-cpu-1x, 256 MB), tek kopya, sürekli açık (yaklaşık 2 $/ay).
# Bütçe sınırı: nermin-aksesuar ile birlikte toplam 5 $/ay. Makine sayısını artırmayın (deploy'da --ha=false).

app = "liderotomarket"
primary_region = "fra"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
