<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { katOpen: true };
  }
  renderVals() {
    const cats = [
      { name: 'İç Aksesuar', count: 3 }, { name: 'Dış Aksesuar', count: 2 }, { name: 'Paspas & Bagaj', count: 2 },
      { name: 'Aydınlatma', count: 1 }, { name: 'Elektronik', count: 2 }, { name: 'Bakım & Temizlik', count: 2 }
    ];
    return {
      cats: cats,
      katOpen: this.state.katOpen,
      katOpenText: this.state.katOpen ? 'true' : 'false',
      chevron: this.state.katOpen ? 'rotate(180deg)' : 'none',
      toggleKat: () => this.setState({ katOpen: !this.state.katOpen })
    };
  }
}
</script>
